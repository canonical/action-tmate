name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # lib/ is the ncc bundle of src/ plus third-party dependencies;
          # dependency vulnerabilities are covered by Renovate instead.
          config: |
            paths-ignore:
              - lib
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
